services:
  db:
    image: postgres:17
    container_name: db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: [
      "postgres",
      "-c", "config_file=/etc/postgresql/postgresql.conf"
    ]

  pgbench:
    image: postgres:17
    container_name: pgbench
    entrypoint: >
      bash -c "
        # initialize pgbench with scale factor 50
        PGPASSWORD=${POSTGRES_PASSWORD:-postgres} pgbench -h db -U ${POSTGRES_USER:-postgres} -i -s 50 postgres;
        # run a 1-minute test with 50 clients, 4 threads
        PGPASSWORD=${POSTGRES_PASSWORD:-postgres} pgbench -h db -U ${POSTGRES_USER:-postgres} -c 50 -j 4 -t 60 postgres;
      "
    env_file:
      - .env

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pg-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml" 
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "password"
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yaml

volumes:
  pgdata:

# Connection
listen_addresses = '*'
port = 5432
max_connections = 100

# Replication (explicit — PG17 defaults are sufficient but clarity helps)
wal_level = replica
max_wal_senders = 5
wal_keep_size = 256MB

# Memory
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB

# Logging
logging_collector = on
log_min_duration_statement = 200
log_checkpoints = on

# Stats
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

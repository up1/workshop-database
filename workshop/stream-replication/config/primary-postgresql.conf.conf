wal_level = replica                # required for streaming replication
archive_mode = on                 # required if you want to archive WALs
archive_command = 'cp %p /var/lib/postgresql/wal_archive/%f'  # or use rsync
max_wal_senders = 10              # number of concurrent standby connections
wal_keep_size = 128MB             # helps standby catch up without needing archived WALs
hot_standby = on                  # allow read-only queries on standby
synchronous_commit = off          # enables async mode
